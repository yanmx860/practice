spring:
  application:
    name: report-service
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
        server-addr: localhost:8848
        file-extension: yaml
        namespace: practice
      discovery:
        server-addr: localhost:8848
        namespace: practice
  datasource:
    url: jdbc:mysql://localhost:3306/practice_report?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: mysqlroot
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 8006
xxl:
  job:
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    executor:
      appname: report-service
      port: 9999
      logpath: /data/xxl-job/logs
      logretentiondays: 30
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
logging:
  level:
    com.practice: debug
