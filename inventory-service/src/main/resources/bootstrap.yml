spring:
  application:
    name: inventory-service
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
        server-addr: localhost:8848
        file-extension: yaml
        namespace: practice
      discovery:
        server-addr: localhost:8848
        namespace: practice
  datasource:
    url: jdbc:mysql://localhost:3306/practice_inventory?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: mysqlroot
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
server:
  port: 8003
seata:
  application-id: inventory-service
  tx-service-group: practice_tx_group
  service:
    vgroup-mapping:
      practice_tx_group: default
    grouplist:
      default: localhost:8091
  registry:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: practice
  config:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: practice
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
logging:
  level:
    com.practice: debug
