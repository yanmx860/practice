spring:
  application:
    name: auth-service
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
        server-addr: localhost:8848
        file-extension: yaml
        namespace: practice
      discovery:
        server-addr: localhost:8848
        namespace: practice
  datasource:
    url: jdbc:mysql://localhost:3306/practice_auth?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: mysqlroot
    driver-class-name: com.mysql.cj.jdbc.Driver
  main:
    allow-bean-definition-overriding: true
server:
  port: 8001
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
logging:
  level:
    com.practice: debug
